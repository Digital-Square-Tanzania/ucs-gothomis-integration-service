integration-service {
  service-host = "127.0.0.1"
  service-port = 8080
  destination {
     url = "http://170.187.199.69:9945/opensrp-event"
     username = "username"
     password = "password"
  }
  routes {
    # If ask takes more time than this to complete the request is failed
    ask-timeout = 60s
  }
}

# Database settings are read from environment variables:
# OPENSRP_DB_URL (optional full JDBC URL)
# OPENSRP_DB_HOST, OPENSRP_DB_PORT, OPENSRP_DB_NAME, OPENSRP_DB_SCHEMA
# OPENSRP_DB_USER, OPENSRP_DB_PASSWORD, OPENSRP_DB_SSLMODE
